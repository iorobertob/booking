{% extends 'base.html' %}

{% block content %}

{% if not current_user.is_authenticated or not current_user.is_admin %}
    <div class="alert alert-danger">You do not have permission to access this page.</div>
{% else %}

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">

        <h1>Edit Item</h1>
        <hr>

        <form method="post" action="">

            <div class="mb-3">
                <label for="name" class="form-label">Item Name</label>
                <input type="text" id="name" name="name" required class="form-control" value="{{ item.name }}">
            </div>

            <div class="mb-3">
                <label for="location" class="form-label">Location</label>
                <select id="location" name="location" required class="form-select">
                    <option value="" disabled>— select location —</option>
                    {% for loc in locations %}
                    <option value="{{ loc.name }}" {% if item.location == loc.name %}selected{% endif %}>{{ loc.name }}</option>
                    {% endfor %}
                    {# Fallback: show unlisted location if not in the managed list #}
                    {% if item.location and item.location not in locations|map(attribute='name')|list %}
                    <option value="{{ item.location }}" selected>{{ item.location }} (unlisted)</option>
                    {% endif %}
                </select>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" id="is_bookable" name="is_bookable"
                       {% if item.is_bookable is not false %}checked{% endif %}
                       class="form-check-input">
                <label for="is_bookable" class="form-check-label">Available for booking</label>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary" style="background-color: #34495e; border: none;">
                    Update Item
                </button>
                <a href="{{ url_for('home') }}" class="btn btn-link text-muted text-center">Cancel</a>
            </div>

        </form>

    </div>
</div>

{% endif %}

{% endblock %}
