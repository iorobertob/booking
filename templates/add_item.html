{% extends 'base.html' %}

{% block content %}

{% if not current_user.is_authenticated or not current_user.is_admin %}
    <div class="alert alert-danger">You do not have permission to access this page.</div>
{% else %}

<div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">

        <h1>Add Item</h1>
        <hr>

        <form method="post" action="">

            <div class="mb-3">
                <label for="name" class="form-label">Item Name</label>
                <input type="text" id="name" name="name" required class="form-control">
            </div>

            <div class="mb-3">
                <label for="location" class="form-label">Location</label>
                <select id="location" name="location" required class="form-select">
                    <option value="" disabled selected>— select location —</option>
                    {% for loc in locations %}
                    <option value="{{ loc.name }}">{{ loc.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" id="is_bookable" name="is_bookable" checked class="form-check-input">
                <label for="is_bookable" class="form-check-label">Available for booking</label>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary" style="background-color: #34495e; border: none;">
                    Add Item
                </button>
                <a href="{{ url_for('home') }}" class="btn btn-link text-muted text-center">Cancel</a>
            </div>

        </form>

    </div>
</div>

{% endif %}

{% endblock %}
